name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHONPATH: .

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python -m cli.tokenomics_cli validate config/examples/example-coin.yaml
      - name: Validate architecture configuration
        run: |
          python - <<'PY'
          from architecture.engine import load_config
          model = load_config('config/examples/example-architecture.yaml')
          errors = model.validate()
          if errors:
              raise SystemExit('\\n'.join(errors))
          print('architecture configuration valid')
          PY
      - run: python -m cli.smart_contract_cli validate config/examples/example-contract.yaml
      - run: mkdir -p build/contracts
      - run: python -m cli.smart_contract_cli generate config/examples/example-contract.yaml build/contracts/ExampleCoin.sol
      - run: python -m cli.security_cli scan build/contracts/ExampleCoin.sol
      - run: python -m cli.wallet_cli config/examples/example-wallet.yaml
      - run: python - <<'PY'
          from fastapi.testclient import TestClient
          from api.app import app
          response = TestClient(app).get('/v1/validate')
          assert response.status_code == 200
          assert response.json()['valid'] is True
          print('API smoke test passed')
        PY
      - run: test -s build/contracts/ExampleCoin.sol
