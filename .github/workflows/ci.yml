name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
env:
  PYTHONPATH: .
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python -m cli.tokenomics_cli validate config/examples/example-coin.yaml
      - run: python -m cli.deployment_cli config/examples/example-deployment.yaml --json
      - run: python -m cli.audit_cli config/examples/example-audit.yaml --json
      - run: python -m cli.integration_cli config/examples/example-integration.yaml --json
      - run: python -m cli.release_cli config/examples/example-release.yaml --json
      - run: python -m cli.operations_cli config/examples/example-operations.yaml --json
      - name: Validate operations incident gate
        run: |
          python - <<'PY'
          from operations.engine import load_spec
          report = load_spec('config/examples/example-operations.yaml').readiness_report()
          assert report['ready'] is True, report
          assert report['checks']['incident_response'] is True, report
          print('operations incident gate passed')
          PY
      - name: API smoke test
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from api.app import app
          c=TestClient(app)
          assert c.get('/v1/validate').json()['valid'] is True
          assert c.get('/v1/operations').json()['ready'] is True
          assert c.get('/v1/incident-readiness').json()['status']=='ready'
          print('API smoke test passed')
          PY
