name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
env:
  PYTHONPATH: .
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python -m cli.tokenomics_cli validate config/examples/example-coin.yaml
      - run: python -m cli.deployment_cli config/examples/example-deployment.yaml --json
      - run: python -m cli.audit_cli config/examples/example-audit.yaml --json
      - run: python -m cli.integration_cli config/examples/example-integration.yaml --json
      - run: python -m cli.release_cli config/examples/example-release.yaml --json
      - name: Validate audit launch gate
        run: |
          python - <<'PY'
          from audit.engine import load_spec
          report = load_spec('config/examples/example-audit.yaml').report()
          assert report['ready'] is True, report
          print('audit launch gate passed')
          PY
      - name: Validate integration observability gate
        run: |
          python - <<'PY'
          from integration.engine import load_spec
          report = load_spec('config/examples/example-integration.yaml').health_report()
          assert report['ready'] is True, report
          print('integration observability gate passed')
          PY
      - name: Validate release disaster recovery gate
        run: |
          python - <<'PY'
          from release.engine import load_spec
          report = load_spec('config/examples/example-release.yaml').readiness_report()
          assert report['ready'] is True, report
          print('release disaster recovery gate passed')
          PY
      - name: API smoke test
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from api.app import app
          c=TestClient(app)
          assert c.get('/v1/validate').json()['valid'] is True
          assert c.get('/v1/deployment').json()['validation_errors']==[]
          assert c.get('/v1/integration').json()['validation_errors']==[]
          assert c.get('/v1/observability').json()['status']=='healthy'
          print('API smoke test passed')
          PY
