name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHONPATH: .

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python -m cli.tokenomics_cli validate config/examples/example-coin.yaml
      - name: Validate architecture configuration
        run: |
          python - <<'PY'
          from architecture.engine import load_config
          model = load_config('config/examples/example-architecture.yaml')
          errors = model.validate()
          if errors:
              raise SystemExit('\\n'.join(errors))
          print('architecture configuration valid')
          PY
      - run: python -m cli.smart_contract_cli validate config/examples/example-contract.yaml
      - run: mkdir -p build/contracts
      - run: python -m cli.smart_contract_cli generate config/examples/example-contract.yaml build/contracts/ExampleCoin.sol
      - run: python -m cli.security_cli scan build/contracts/ExampleCoin.sol
      - run: python -m cli.wallet_cli config/examples/example-wallet.yaml
      - run: python -m cli.explorer_cli --json
      - run: python -m cli.staking_cli validate config/examples/example-staking.yaml
      - run: python -m cli.staking_cli reward config/examples/example-staking.yaml 1000 365
      - run: python -m cli.governance_cli validate config/examples/example-governance.yaml
      - run: python -m cli.governance_cli evaluate config/examples/example-governance.yaml p-001 'Increase treasury budget' treasury_spend alice 2000 10000 3000 1000
      - name: API smoke test
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from api.app import app
          client = TestClient(app)
          assert client.get('/v1/validate').json()['valid'] is True
          assert client.get('/v1/explorer/status').json()['indexed'] is True
          assert client.get('/v1/explorer/blocks/0').status_code == 200
          assert client.get('/v1/staking').json()['validation_errors'] == []
          assert client.get('/v1/staking/reward?amount=1000&duration_days=365').status_code == 200
          assert client.get('/v1/governance').json()['validation_errors'] == []
          assert client.get('/v1/governance/evaluate?proposal_id=p-001&title=Increase%20treasury%20budget&proposal_type=treasury_spend&proposer=alice&voting_power=2000&total_voting_power=10000&yes_votes=3000&no_votes=1000').json()['outcome'] == 'passed'
          print('API smoke test passed')
          PY
      - run: test -s build/contracts/ExampleCoin.sol
