# Example AceCoin Core testnet configuration.
# Keep RPC bound to the private Docker network.
server=1
listen=1
txindex=1
prune=0

rpcbind=0.0.0.0
rpcallowip=172.16.0.0/12
rpcport=19332

# Replace these credentials with secrets; do not commit real credentials.
rpcuser=CHANGE_ME_RPC_USER
rpcpassword=CHANGE_ME_RPC_PASSWORD

# Choose an appropriate P2P testnet port for AceCoin Core.
port=19333
